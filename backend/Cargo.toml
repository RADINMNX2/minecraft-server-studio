[package]
name = "mcss_backend"
version = "1.0.0"
edition = "2021"
description = "Backend engine for Minecraft Server Studio"
default-run = "mcss_backend"

[[bin]]
name = "mcss_backend"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
directories = "5"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
zip = "2"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
